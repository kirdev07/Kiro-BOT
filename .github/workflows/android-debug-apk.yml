name: Android debug APK

on:
  workflow_dispatch:
  push:
    branches:
      - 'audit/compliance-review-2026-10-22'
    paths:
      - 'app/src/main/**'
      - 'app/build.gradle'
      - 'build.gradle'
      - 'gradle.properties'
      - 'gradle/**'
      - '.github/workflows/android-debug-apk.yml'

permissions:
  contents: read

jobs:
  debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Configure Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDK/cmdline-tools" -type f -name sdkmanager -print -quit 2>/dev/null || true)"
          fi
          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "::error::Android sdkmanager not found"
            exit 1
          fi
          "$SDKMANAGER" --sdk_root="$SDK" --install "platforms;android-34" "build-tools;34.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        run: bash ./gradlew :app:assembleDebug --no-daemon --stacktrace
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: kiro-bot-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
