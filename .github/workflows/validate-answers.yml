name: Answer database validation

on:
  pull_request:
    paths:
      - 'app/src/main/assets/answer.txt'
      - 'scripts/validate_answers.py'
      - '.github/workflows/validate-answers.yml'
  push:
    paths:
      - 'app/src/main/assets/answer.txt'
      - 'scripts/validate_answers.py'
      - '.github/workflows/validate-answers.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate answer database
        run: python scripts/validate_answers.py
