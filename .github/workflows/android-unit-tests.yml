name: Android unit tests

on:
  pull_request:
    paths:
      - 'app/src/main/**'
      - 'app/src/test/**'
      - 'app/build.gradle'
      - 'build.gradle'
      - 'gradle.properties'
      - 'gradle/**'
      - '.github/workflows/android-unit-tests.yml'
  push:
    paths:
      - 'app/src/main/**'
      - 'app/src/test/**'
      - 'app/build.gradle'
      - 'build.gradle'
      - 'gradle.properties'
      - 'gradle/**'
      - '.github/workflows/android-unit-tests.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Configure Android SDK from runner
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDK/cmdline-tools" -type f -name sdkmanager -print -quit 2>/dev/null || true)"
          fi
          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "::error::Android sdkmanager not found under $SDK/cmdline-tools"
            exit 1
          fi
          echo "Using $SDKMANAGER"
          "$SDKMANAGER" --sdk_root="$SDK" --install "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Run Android JVM unit tests
        run: bash ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace
      - name: Assemble unsigned-for-release debug APK
        run: bash ./gradlew :app:assembleDebug --no-daemon --stacktrace
      - name: Upload experimental debug APK
        uses: actions/upload-artifact@v4
        with:
          name: kiro-bot-experimental-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
